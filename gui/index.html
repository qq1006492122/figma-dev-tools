<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Dev Tools - 配置向导</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f0ff',
              100: '#e0e0ff',
              200: '#c7c7ff',
              300: '#a3a3ff',
              400: '#7a7aff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            },
            figma: {
              purple: '#a259ff',
              blue: '#1abcfe',
              green: '#0acf83',
              red: '#ff7262',
              orange: '#f24e1e',
            }
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
</head>
<body class="font-inter bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl">
      <div id="app" class="bg-white rounded-2xl shadow-2xl overflow-hidden">
        <!-- 顶部品牌栏 -->
        <div class="bg-gradient-to-r from-primary-600 to-figma-purple px-8 py-6">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
              <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.852 8.981h-4.588V0h4.588c2.476 0 4.49 2.014 4.49 4.49s-2.014 4.491-4.49 4.491zM12.735 7.51h3.117c1.665 0 3.019-1.355 3.019-3.019s-1.355-3.019-3.019-3.019h-3.117V7.51zm0 1.471H8.148c-2.476 0-4.49-2.014-4.49-4.49S5.672 0 8.148 0h4.588v8.981zm-4.587-7.51c-1.665 0-3.019 1.355-3.019 3.019s1.354 3.02 3.019 3.02h3.117V1.471H8.148zm4.587 15.019H8.148c-2.476 0-4.49-2.014-4.49-4.49s2.014-4.49 4.49-4.49h4.588v8.98zM8.148 8.981c-1.665 0-3.019 1.355-3.019 3.019s1.355 3.019 3.019 3.019h3.117V8.981H8.148zM8.172 24c-2.489 0-4.515-2.014-4.515-4.49s2.014-4.49 4.49-4.49h4.588v4.441c0 2.503-2.047 4.539-4.563 4.539zm-.024-7.51a3.023 3.023 0 0 0-3.019 3.019c0 1.665 1.365 3.019 3.044 3.019 1.705 0 3.093-1.376 3.093-3.068v-2.97H8.148zm7.704 0h-.098c-2.476 0-4.49-2.014-4.49-4.49s2.014-4.49 4.49-4.49h.098c2.476 0 4.49 2.014 4.49 4.49s-2.014 4.49-4.49 4.49zm-.098-7.509c-1.665 0-3.019 1.355-3.019 3.019s1.355 3.019 3.019 3.019h.098c1.665 0 3.019-1.355 3.019-3.019s-1.355-3.019-3.019-3.019h-.098z"/>
              </svg>
            </div>
            <div>
              <h1 class="text-xl font-bold text-white" data-i18n="app.title">Figma Dev Tools</h1>
              <p class="text-white/70 text-sm" data-i18n="app.subtitle">配置向导 v1.4.8</p>
            </div>
          </div>
        </div>

        <!-- 步骤指示器 -->
        <div class="px-8 pt-6 pb-2">
          <div id="step-indicator" class="flex items-center justify-between">
            <!-- 动态生成步骤 -->
          </div>
        </div>

        <!-- 内容区域 -->
        <div id="content" class="px-8 py-6">
          <!-- 动态加载内容 -->
        </div>

        <!-- 底部导航 -->
        <div id="footer-nav" class="px-8 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
          <!-- 动态生成按钮 -->
        </div>
      </div>

      <p class="text-center text-gray-400 text-xs mt-6">
        <span data-i18n="app.footer">Figma Dev Tools v1.4.8 — 在 AI 编辑器中直接调用 MCP 工具</span>
      </p>
    </div>
  </div>

  <div id="toast" class="fixed top-6 right-6 z-50 hidden">
    <div id="toast-content" class="px-6 py-3 rounded-lg shadow-lg text-white font-medium transform translate-x-full transition-transform duration-300"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
